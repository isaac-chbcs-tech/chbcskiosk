<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen team</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><main>
<div id="login" hidden>
  <h1>👩‍🍳 Kitchen team</h1>
  <form onsubmit="login(event)" class="panel">
    <p><label>Email<br><input type="email" id="em" required></label></p>
    <p><label>Password<br><input type="password" id="pw" required></label></p>
    <button class="tile go" type="submit">Log in</button><p id="err"></p>
  </form>
</div>
<div id="app" hidden>
  <div class="bar noprint"><h1>👩‍🍳 Kitchen team</h1>
    <div class="row"><select id="sess" aria-label="Choose food menu" onchange="pick(this.value)"></select>
    <button class="tab" onclick="logout()">Log out</button></div></div>
  <div class="tabs noprint" id="tabs"></div>
  <div class="panel" id="out"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
let students=[],sessions=[],orders=[],sel,curTab='setup';
const $=id=>document.getElementById(id), out=h=>$('out').innerHTML=h;
const S=()=>sessions.find(s=>s.id==sel);
const dishes=()=>[...(S()?.menu_items||[])].sort((a,b)=>a.position-b.position);
const dn=id=>dishes().find(d=>d.id==id)?.name||'';
const sorted=()=>[...orders].sort((a,b)=>CENTRES.indexOf(a.students.centre)-CENTRES.indexOf(b.students.centre)||a.students.first_name.localeCompare(b.students.first_name));
const counts=()=>{const c={};dishes().forEach(d=>c[d.id]=[]);sorted().forEach(o=>[o.item1,o.item2].filter(Boolean).forEach(i=>c[i]&&c[i].push(o.students)));return c;};
const head=t=>`<h2>${t}</h2><p class="sub">${S()?esc(dayLabel(S().cook_date)):'No food menu set up yet'}</p>`;
const printBtn=`<p class="noprint"><button class="tile go" onclick="print()">🖨️ Print this page</button></p>`;

const pic=(u,w,m='0 auto 10px')=>u?`<img src="${esc(u)}" alt="" loading="lazy" style="display:block;width:${w};max-width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:3px solid #1d2a44;margin:${m}">`:'';
const TABS={setup:['⚙️ Set up food',setup],totals:['📊 Totals',totals],cook:['🍳 Cooking list',cook],shop:['🛒 Shopping list',shop],centres:['🏫 Grade sheets',centres],feedback:['⭐ Feedback',feedback]};
function tab(t){curTab=t;$('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="tab ${k==t?'on':''}" onclick="tab('${k}')">${v[0]}</button>`).join('');TABS[t][1]();}

async function boot(){
  const {data}=await db.auth.getSession();
  $('login').hidden=!!data.session;$('app').hidden=!data.session;
  if(data.session)load();
}
async function login(e){e.preventDefault();
  const {error}=await db.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  if(error)$('err').textContent='That email or password is not right.';else boot();
}
async function logout(){await db.auth.signOut();boot();}
async function load(keep){
  const [a,b]=await Promise.all([db.from('students').select('*'),db.from('sessions').select('*, menu_items(*)').order('created_at',{ascending:false})]);
  students=a.data||[];sessions=b.data||[];
  if(!keep||!S())sel=sessions[0]?.id;
  $('sess').innerHTML=sessions.map(s=>`<option value="${s.id}" ${s.id==sel?'selected':''}>${esc(dayLabel(s.cook_date))} (${s.status})</option>`).join('');
  await loadOrders();tab(curTab);
}
async function loadOrders(){
  if(!sel){orders=[];return;}
  const {data}=await db.from('orders').select('*, students(*)').eq('session_id',sel);orders=data||[];
}
async function pick(id){sel=id;await loadOrders();tab(curTab);}

function setup(){
  const s=S(),lbl={open:'Taking orders',closed:'Orders closed',cooked:'Cooked'};
  out(`<h2>Current food menu</h2>${s?`<p><b>${esc(dayLabel(s.cook_date))}</b> <span class="pill ${s.status}">${lbl[s.status]}</span> ${orders.length} orders so far</p>
  <div class="row">${s.status=='open'?`<button class="tile" onclick="setStatus('closed')">Close orders</button>`:''}
  ${s.status=='closed'?`<button class="tile" onclick="setStatus('open')">Reopen orders</button><button class="tile" onclick="setStatus('cooked')">Mark as cooked</button>`:''}</div>
  <p class="sub">Students can rate the food once it is marked as cooked.</p>
  <h3>Dish photos</h3>${dishes().map(d=>`<p class="dishrow">${pic(d.image_url,'96px','0')}<b>${esc(d.name)}</b> <input type="file" accept="image/*" onchange="setPhoto('${d.id}',this.files[0])" aria-label="Photo for ${esc(d.name)}"></p>`).join('')}`:'<p>No food menu yet. Start one below.</p>'}
  <h2>Start the next food menu</h2>
  <p class="sub">This closes the current food menu and opens orders for the new one. Old orders are kept.</p>
  <p><label>Cooking day<br><input type="date" id="d"></label></p>
  ${[1,2,3,4].map(i=>`<p class="dishrow"><input type="text" class="dn" placeholder="Dish ${i}" aria-label="Dish ${i}" maxlength="40"><input type="file" class="df" accept="image/*" aria-label="Photo for dish ${i} (optional)"></p>`).join('')}
  <button class="tile go" onclick="newLunch()">Start new food menu</button><div id="pwbox"></div>`);
  $('d').valueAsDate=new Date();loadPw();
}
async function setStatus(st){await db.from('sessions').update({status:st}).eq('id',sel);load(true);}
async function shrink(file){
  const img=await createImageBitmap(file),k=Math.min(1,900/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.82));
}
async function upload(file,name){
  try{
    const path=`${sel}/${name}-${Date.now()}.jpg`;
    const {error}=await db.storage.from('dish-photos').upload(path,await shrink(file),{contentType:'image/jpeg'});
    return error?null:db.storage.from('dish-photos').getPublicUrl(path).data.publicUrl;
  }catch(e){return null;}
}
async function setPhoto(id,file){
  if(!file)return;
  const url=await upload(file,id);
  if(!url)return alert('The photo could not be saved. Try a different picture.');
  await db.from('menu_items').update({image_url:url}).eq('id',id);load(true);
}
async function newLunch(){
  const date=$('d').value,rows=[...document.querySelectorAll('.dishrow')].map(r=>({name:r.querySelector('.dn').value.trim(),file:r.querySelector('.df').files[0]})).filter(r=>r.name);
  if(!date||!rows.length)return alert('Pick a day and type at least one dish.');
  if(!confirm('Start a new food menu? Orders for the current food menu will close.'))return;
  await db.from('sessions').update({status:'closed'}).eq('status','open');
  const {data,error}=await db.from('sessions').insert({cook_date:date}).select().single();
  if(error)return alert('Could not start the food menu. Tell a teacher.');
  sel=data.id;let failed=0;const items=[];
  for(let i=0;i<rows.length;i++){
    let url=null;if(rows[i].file){url=await upload(rows[i].file,'new'+i);if(!url)failed++;}
    items.push({session_id:data.id,name:rows[i].name,position:i,image_url:url});
  }
  await db.from('menu_items').insert(items);
  if(failed)alert('The food menu has started, but '+failed+' photo(s) could not be saved. You can add them again under Dish photos.');
  load(true);
}

async function loadPw(){
  const {data}=await db.from('app_settings').select('value').eq('key','order_password').maybeSingle();
  if(!$('pwbox'))return;
  $('pwbox').innerHTML=`<h2>Food password</h2>
  <p class="sub">Students type this once a day on their device. Changing it locks every device until the new password is entered.</p>
  <p><input type="text" id="np" value="${esc(data?.value||'')}" maxlength="40" aria-label="Food password"></p>
  <button class="tile" onclick="savePw()">Save password</button>`;
}
async function savePw(){
  const v=$('np').value.trim();
  if(v.length<4)return alert('Use at least 4 characters.');
  const {error}=await db.from('app_settings').update({value:v}).eq('key','order_password');
  alert(error?'The password could not be saved.':'Password saved.');
}
function totals(){
  const c=counts();
  out(`${head('Dish totals')}<table><tr><th>Dish</th>${CENTRES.map(x=>`<th>${x}</th>`).join('')}<th>Total</th></tr>
  ${dishes().map(d=>`<tr><td>${esc(d.name)}</td>${CENTRES.map(x=>`<td>${c[d.id].filter(s=>s.centre==x).length}</td>`).join('')}<td class="tot">${c[d.id].length}</td></tr>`).join('')}</table>
  <p>${orders.length} students ordered.</p>${printBtn}`);
}
function cook(){
  const c=counts();
  out(dishes().map(d=>`<section class="sheet">${head(`${esc(d.name)}: ${c[d.id].length} portions`)}<p>Tick each one when it is cooked.</p>
  <div class="names">${c[d.id].map(s=>`<label class="chk"><input type="checkbox"><span>${esc(nm(s))} <small>${s.centre}</small></span></label>`).join('')||'<p>No orders.</p>'}</div></section>`).join('')+printBtn);
}
function shop(){
  const c=counts();
  out(`<section class="sheet">${head('Shopping list')}<table><tr><th>Dish</th><th>Portions</th><th>What to buy</th><th>Bought</th></tr>
  ${dishes().map(d=>`<tr><td>${esc(d.name)}</td><td class="tot">${c[d.id].length}</td><td class="blank"></td><td>☐</td></tr>`).join('')}</table></section>${printBtn}`);
}
function centres(){
  out(CENTRES.map(x=>{const l=sorted().filter(o=>o.students.centre==x);
    return `<section class="sheet">${head(`Grade ${x}`)}<table><tr><th>Name</th><th>Order</th><th>Collected</th></tr>
    ${l.map(o=>`<tr><td>${esc(nm(o.students))}</td><td>${[o.item1,o.item2].filter(Boolean).map(i=>esc(dn(i))).join(' + ')}</td><td>☐</td></tr>`).join('')||'<tr><td colspan="3">No orders.</td></tr>'}</table></section>`;}).join('')+printBtn);
}
async function feedback(){
  const {data}=await db.from('feedback').select('*').eq('session_id',sel);const f=data||[];
  out(`${head('Feedback')}<table><tr><th>Dish</th><th>Average rating</th><th>Ratings</th></tr>
  ${dishes().map(d=>{const r=f.filter(x=>x.menu_item_id==d.id),a=r.length?r.reduce((t,x)=>t+x.stars,0)/r.length:0,k=Math.round(a);
  return `<tr><td>${esc(d.name)}</td><td>${r.length?'★'.repeat(k)+'☆'.repeat(5-k)+' '+a.toFixed(1):'No ratings yet'}</td><td>${r.length}</td></tr>`;}).join('')}</table>${printBtn}`);
}
boot();
</script></body></html>
