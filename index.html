<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><main id="app"><p>Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
let students=[],sessions=[],mode,centre,student,picked=[],stars={},token=null;
const app=document.getElementById('app');
const show=h=>{app.innerHTML=h;scrollTo(0,0)};
const again=`<p><button class="link" onclick="home()">← Start again</button></p>`;
const msg=(t,p)=>`<h1>${t}</h1><p>${p}</p>${again}`;
const cur=()=>sessions.find(s=>mode=='order'?s.status=='open':s.status!='cooked');
const items=s=>[...s.menu_items].sort((a,b)=>a.position-b.position);
const pic=(u,w,m='0 auto 10px')=>u?`<img src="${esc(u)}" alt="" loading="lazy" style="display:block;width:${w};max-width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:3px solid #1d2a44;margin:${m}">`:'';

async function init(){
  const b=await db.from('sessions').select('*, menu_items(*)').order('created_at',{ascending:false});
  if(b.error)return show(`<h1>Oops</h1><p>The food page could not load. Tell a teacher.</p>`);
  sessions=b.data;
  try{token=localStorage.getItem('foodToken');}catch(e){}
  if(token&&await loadRoster())return home();
  lock();
}
function lock(note=''){
  show(`<h1>🔒 Food orders</h1><p>Ask your teacher for the password.</p>
  <p><input type="password" id="pw" aria-label="Password" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()" style="font-size:1.4rem;width:100%;max-width:420px"></p>
  ${note?`<p>${esc(note)}</p>`:''}<button class="tile go" onclick="unlock()">Unlock</button>`);
}
async function unlock(){
  const {data,error}=await db.rpc('unlock',{pw:document.getElementById('pw').value});
  if(error||!data)return lock('That password is not right. Try again.');
  token=data;try{localStorage.setItem('foodToken',token);}catch(e){}
  if(await loadRoster())home();else lock('Something went wrong. Try again.');
}
async function loadRoster(){
  const ok=await db.rpc('check_token',{t:token});
  if(ok.data!==true)return false;
  const r=await db.rpc('get_roster',{t:token});
  if(r.error)return false;
  students=r.data||[];return true;
}
function expire(){
  try{localStorage.removeItem('foodToken');}catch(e){}
  token=null;students=[];lock('The password has expired. Please enter it again.');
}
function home(){
  mode=centre=student=null;picked=[];stars={};
  show(`<h1>🍴 Food time!</h1>
  <div class="grid two"><button class="tile big a" onclick="start('order')">🍽️<br>Order food</button>
  <button class="tile big b" onclick="start('rate')">⭐<br>Rate my food</button></div>`);
}
function start(m){
  mode=m;
  if(!cur())return show(msg(m=='order'?'Ordering is closed':'Ratings are not open',m=='order'?'Ask the kitchen team when ordering opens again.':'Ask the kitchen team when the next food is ready.'));
  pickCentre();
}
function pickCentre(){
  show(`<h1>Which grade are you in?</h1><div class="grid">${CENTRES.map(c=>`<button class="tile" onclick="pickName('${c}')">${c}</button>`).join('')}</div>${again}`);
}
function pickName(c){
  centre=c;const l=students.filter(s=>s.centre==c);
  show(`<h1>Tap your name</h1>${l.length?`<div class="grid">${l.map(s=>`<button class="tile" onclick="chooseStudent('${s.id}')">${esc(nm(s))}</button>`).join('')}</div>`:'<p>No names are here yet. Tell a teacher.</p>'}<p><button class="link" onclick="pickCentre()">← Back</button></p>`);
}
function chooseStudent(id){student=students.find(s=>s.id==id);picked=[];stars={};mode=='order'?dishes():rate();}

function dishes(){
  show(`<h1>Hi ${esc(student.first_name)}! Pick 1 or 2</h1>
  <div class="grid">${items(cur()).map((m,i)=>`<button class="tile dish d${i%4} ${picked.includes(m.id)?'on':''}" onclick="toggle('${m.id}')">${pic(m.image_url,'100%')}${esc(m.name)}</button>`).join('')}</div>
  <p class="sub">${picked.length} of 2 picked</p>
  <button class="tile go" ${picked.length?'':'disabled'} onclick="send()">Send my order</button>
  <p><button class="link" onclick="pickName('${centre}')">← That is not me</button></p>`);
}
function toggle(id){const i=picked.indexOf(id);if(i>-1)picked.splice(i,1);else if(picked.length<2)picked.push(id);dishes();}
async function send(){
  const {error}=await db.rpc('place_order',{t:token,p_session:cur().id,p_student:student.id,p_item1:picked[0],p_item2:picked[1]||null});
  if(error&&error.code=='28000')return expire();
  if(error)return show(error.code=='23505'?msg('You have already ordered','Ask the kitchen team if you need to change your order.'):msg('Order not sent','Ordering may have just closed. Tell a teacher.'));
  show(`<h1>🎉 Order sent!</h1><p>Enjoy your food, ${esc(student.first_name)}.</p><button class="tile go" onclick="home()">Done</button>`);
}

function rate(){
  show(`<h1>How was the food, ${esc(student.first_name)}?</h1><p class="sub">Only rate what you ate.</p>
  ${items(cur()).map(m=>`<div class="rate">${pic(m.image_url,'140px','12px 0 0')}<h3>${esc(m.name)}</h3><div class="stars">${[1,2,3,4,5].map(n=>`<button aria-label="${n} stars" class="${(stars[m.id]||0)>=n?'f':''}" onclick="setStar('${m.id}',${n})">★</button>`).join('')}</div></div>`).join('')}
  <button class="tile go" ${Object.keys(stars).length?'':'disabled'} onclick="sendRate()">Send my ratings</button>
  <p><button class="link" onclick="pickName('${centre}')">← That is not me</button></p>`);
}
function setStar(id,n){stars[id]=n;rate();}
async function sendRate(){
  const rows=Object.entries(stars).map(([id,n])=>({menu_item_id:id,stars:n}));
  const {error}=await db.rpc('submit_ratings',{t:token,p_session:cur().id,p_student:student.id,p_ratings:rows});
  if(error&&error.code=='28000')return expire();
  if(error)return show(error.code=='23505'?msg('You have already rated this food','Thanks for your ratings!'):msg('Ratings not sent','Tell a teacher.'));
  show(`<h1>⭐ Thank you!</h1><p>Your ratings help the kitchen team.</p><button class="tile go" onclick="home()">Done</button>`);
}
init();
</script></body></html>
