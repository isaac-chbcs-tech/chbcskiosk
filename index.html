<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lunch orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><main id="app"><p>Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
let students=[],sessions=[],mode,centre,student,picked=[],stars={};
const app=document.getElementById('app');
const show=h=>{app.innerHTML=h;scrollTo(0,0)};
const again=`<p><button class="link" onclick="home()">← Start again</button></p>`;
const msg=(t,p)=>`<h1>${t}</h1><p>${p}</p>${again}`;
const cur=()=>sessions.find(s=>s.status==(mode=='order'?'open':'cooked'));
const items=s=>[...s.menu_items].sort((a,b)=>a.position-b.position);

async function init(){
  const [a,b]=await Promise.all([db.from('students').select('*').order('first_name'),db.from('sessions').select('*, menu_items(*)').order('created_at',{ascending:false})]);
  if(a.error||b.error)return show(`<h1>Oops</h1><p>The lunch page could not load. Tell a teacher.</p>`);
  students=a.data;sessions=b.data;home();
}
function home(){
  mode=centre=student=null;picked=[];stars={};
  const o=sessions.find(s=>s.status=='open');
  show(`<h1>🍴 Lunch time!</h1>${o?`<p class="sub">Cooking on ${esc(dayLabel(o.cook_date))}</p>`:''}
  <div class="grid two"><button class="tile big a" onclick="start('order')">🍽️<br>Order lunch</button>
  <button class="tile big b" onclick="start('rate')">⭐<br>Rate my food</button></div>`);
}
function start(m){
  mode=m;
  if(!cur())return show(msg(m=='order'?'Ordering is closed':'Nothing to rate yet',m=='order'?'Ask the kitchen team when the next lunch opens.':'Come back after the food has been cooked.'));
  pickCentre();
}
function pickCentre(){
  show(`<h1>Which learning centre are you in?</h1><div class="grid">${CENTRES.map(c=>`<button class="tile" onclick="pickName('${c}')">${c}</button>`).join('')}</div>${again}`);
}
function pickName(c){
  centre=c;const l=students.filter(s=>s.centre==c);
  show(`<h1>Tap your name</h1>${l.length?`<div class="grid">${l.map(s=>`<button class="tile" onclick="chooseStudent('${s.id}')">${esc(nm(s))}</button>`).join('')}</div>`:'<p>No names are here yet. Tell a teacher.</p>'}<p><button class="link" onclick="pickCentre()">← Back</button></p>`);
}
function chooseStudent(id){student=students.find(s=>s.id==id);picked=[];stars={};mode=='order'?dishes():rate();}

function dishes(){
  show(`<h1>Hi ${esc(student.first_name)}! Pick 1 or 2</h1>
  <div class="grid">${items(cur()).map((m,i)=>`<button class="tile dish d${i%4} ${picked.includes(m.id)?'on':''}" onclick="toggle('${m.id}')">${esc(m.name)}</button>`).join('')}</div>
  <p class="sub">${picked.length} of 2 picked</p>
  <button class="tile go" ${picked.length?'':'disabled'} onclick="send()">Send my order</button>
  <p><button class="link" onclick="pickName('${centre}')">← That is not me</button></p>`);
}
function toggle(id){const i=picked.indexOf(id);if(i>-1)picked.splice(i,1);else if(picked.length<2)picked.push(id);dishes();}
async function send(){
  const {error}=await db.from('orders').insert({session_id:cur().id,student_id:student.id,item1:picked[0],item2:picked[1]||null});
  if(error)return show(error.code=='23505'?msg('You have already ordered','Ask the kitchen team if you need to change your order.'):msg('Order not sent','Ordering may have just closed. Tell a teacher.'));
  show(`<h1>🎉 Order sent!</h1><p>See you at lunch, ${esc(student.first_name)}.</p><button class="tile go" onclick="home()">Done</button>`);
}

function rate(){
  show(`<h1>How was the food, ${esc(student.first_name)}?</h1><p class="sub">Only rate what you ate.</p>
  ${items(cur()).map(m=>`<div class="rate"><h3>${esc(m.name)}</h3><div class="stars">${[1,2,3,4,5].map(n=>`<button aria-label="${n} stars" class="${(stars[m.id]||0)>=n?'f':''}" onclick="setStar('${m.id}',${n})">★</button>`).join('')}</div></div>`).join('')}
  <button class="tile go" ${Object.keys(stars).length?'':'disabled'} onclick="sendRate()">Send my ratings</button>
  <p><button class="link" onclick="pickName('${centre}')">← That is not me</button></p>`);
}
function setStar(id,n){stars[id]=n;rate();}
async function sendRate(){
  const rows=Object.entries(stars).map(([id,n])=>({session_id:cur().id,student_id:student.id,menu_item_id:id,stars:n}));
  const {error}=await db.from('feedback').insert(rows);
  if(error)return show(error.code=='23505'?msg('You have already rated this food','Thanks for your ratings!'):msg('Ratings not sent','Tell a teacher.'));
  show(`<h1>⭐ Thank you!</h1><p>Your ratings help the kitchen team.</p><button class="tile go" onclick="home()">Done</button>`);
}
init();
</script></body></html>
